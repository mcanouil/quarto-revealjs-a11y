name: Accessibility

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  axe:
    runs-on: ubuntu-latest
    if: ${{ github.event.pull_request.draft != true }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: quarto-dev/quarto-actions/setup@v2

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Render the test fixture deck
        id: render
        run: quarto render tests

      - name: Install test dependencies
        id: deps
        working-directory: tests
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Run axe-core accessibility check
        working-directory: tests
        run: node axe-check.mjs _a11y-fixture.html

      - name: Run slide landmark keyboard check
        if: ${{ !cancelled() && steps.render.outcome == 'success' && steps.deps.outcome == 'success' }}
        working-directory: tests
        run: node landmarks-check.mjs _a11y-fixture.html

      - name: Run print fragment separation check
        if: ${{ !cancelled() && steps.render.outcome == 'success' && steps.deps.outcome == 'success' }}
        working-directory: tests
        run: |
          node print-fragments-check.mjs _fragments-fixture.html separated
          node print-fragments-check.mjs _fragments-together-fixture.html together
      - name: Run high contrast chrome check
        if: ${{ !cancelled() && steps.render.outcome == 'success' && steps.deps.outcome == 'success' }}
        working-directory: tests
        run: node high-contrast-check.mjs _high-contrast-fixture.html

      - name: Upload rendered deck
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: a11y-fixture-deck
          path: |
            tests/_a11y-fixture.html
            tests/_fragments-fixture.html
            tests/_fragments-together-fixture.html
            tests/_high-contrast-fixture.html
